name: ts-playwright

on:
  push:
    branches: [main]
    paths:
      - 'frameworks/ts-playwright/**'
      - '.github/workflows/ts-playwright.yml'
  pull_request:
    paths:
      - 'frameworks/ts-playwright/**'
      - '.github/workflows/ts-playwright.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frameworks/ts-playwright
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frameworks/ts-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          # CI secrets are namespaced TS_TEST_* so the two frameworks can
          # target different tenants without colliding. They are mapped here
          # to the env keys that support/env.ts actually reads (see
          # frameworks/ts-playwright/.env.example).
          BASE_URL: ${{ secrets.TS_TEST_BASE_URL }}
          API_BASE_URL: ${{ secrets.TS_TEST_API_BASE_URL }}
          API_KEY: ${{ secrets.TS_TEST_API_KEY }}
          HOST_USER_EMAIL: ${{ secrets.TS_TEST_HOST_USER_EMAIL }}
          HOST_USER_PASSWORD: ${{ secrets.TS_TEST_HOST_USER_PASSWORD }}
          GUEST_USER_EMAIL: ${{ secrets.TS_TEST_GUEST_USER_EMAIL }}
          GUEST_USER_PASSWORD: ${{ secrets.TS_TEST_GUEST_USER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frameworks/ts-playwright/playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frameworks/ts-playwright/test-results/
          if-no-files-found: ignore